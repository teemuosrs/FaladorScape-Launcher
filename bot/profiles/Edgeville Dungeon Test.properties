#Edgeville Dungeon Test
#============================================================
# Test profile for the post-pathfinding interaction layer.
#
# HOW TO USE:
#   1. Stand at the Edgeville dungeon ladder (surface) and press
#      "Set Center Tile" in the sidebar, OR go underground and set
#      the center tile there.
#   2. Press Start (Universal Assist Only).
#   3. The bot walks to the configured center tile using the
#      collision-map pathfinder.  When a step is blocked it:
#        - opens doors/gates (walls.txt data-driven)
#        - climbs ladders/stairs (objects.txt data-driven)
#        - pulls levers (objects.txt data-driven)
#      then continues on the same path until the destination is
#      reached.
#
# Center tile is deliberately NOT hardcoded (set it yourself from
# Settings -> Center Tile or the Set Center Tile button).
#============================================================
centerTileX=-1
centerTileZ=-1
centerTileRadius=15
returnToCenterTile=true

# Post-pathfinding obstacle interactions
autoOpenDoors=true
climbLadders=true
useLevers=true

# Navigation destination (bank) unused in this test — center tile is the goal
useWalkToBankCoords=false
walkToBankX=-1
walkToBankZ=-1
useBankToCenterCoords=false
bankToCenterX=-1
bankToCenterZ=-1
bankingEnabled=false
lootingEnabled=false

# Rest of the settings stay at defaults (false/empty) so the test
# only exercises walking + obstacle interaction.
autoLoot=false
lootIds=
autoEat=false
foodIds=
eatBelowHpPercent=50
autoBury=false
boneIds=
autoAttackNpcs=false
targetNpcIds=
autoInteractObjects=false
targetObjectIds=
autoPickpocket=false
castMagic=false
spellIds=
autoClickItems=false
autoClickItemIds=
autoDropFull=false
dropIds=
useToBankWaypoints=false
toBankWaypointsString=
useFromBankWaypoints=false
fromBankWaypointsString=
autoLogin=false
loginUsername=
loginPassword=
showIdsOverlay=false
afkMode=false
afkIntervalMinutes=10
afkDirection=0
afkTileCount=2

# Walk delay — keep it low so the interaction layer is exercised quickly
delayWalk=800
delayInteract=600
antibanEnabled=false
